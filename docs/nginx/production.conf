# Produkce — subdoména + SSL
# Použití: https://demo.shipard.cz/api/v1/...
server {
    listen 443 ssl;
    server_name *.shipard.cz;

    root /opt/shipard/shpd/public;
    index index.php;

    # Versioned system parameters — updated via git pull + nginx reload
    include /opt/shipard/shpd/docs/nginx/shipard-common.conf;
    include /opt/shipard/shpd/docs/nginx/shipard-tls.conf;

    # Vývojářský dashboard existuje jen v módu development — v produkci
    # neservírovat ani jeho statické soubory (public/_dev/ z npm run build).
    location ^~ /_dev/ {
        return 404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
    }
}
