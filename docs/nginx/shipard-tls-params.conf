# Shipard TLS parameters — include ONLY in HTTPS (listen 443 ssl) server blocks.
#
# Protocols, session cache and curves, WITHOUT the HSTS header:
#   production   includes shipard-tls.conf (these parameters + HSTS)
#   development  includes this file only (#183 D5) — HSTS on a development
#                name would forbid clicking through a certificate warning and
#                the browser would remember it for two years
# Changes take effect with: git pull && nginx -t && systemctl reload nginx
ssl_session_timeout 60m;
ssl_session_cache shared:SSL:50m;

ssl_protocols TLSv1.3;
ssl_ecdh_curve X25519:prime256v1:secp384r1;
ssl_prefer_server_ciphers off;
