# Shipard TLS policy — include ONLY in HTTPS (listen 443 ssl) server blocks.
#
# Production policy: the TLS parameters plus HSTS. The file keeps its name so
# that existing production site files work without regeneration; development
# https blocks include only shipard-tls-params.conf (#183 D5).
include /opt/shipard/shpd/docs/nginx/shipard-tls-params.conf;

add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload" always;
