# ─── Development — http ──────────────────────────────────────────────────────
#
# Template of /etc/nginx/sites-available/shipard.conf (install-packages.sh).
# In development the app is opened at: http://{host}/{ds-id}/app/
# The frontend JS detects the DS ID from the URL and prefixes all API
# requests with it automatically: /{ds-id}/api/v1/...
#
# Addressing by DS ID in the path depends on the server mode, not on the host
# (#183 D1) — the block is the default server on port 80, so it also answers
# http://localhost/ (WSL) and names. The https entries live in their own site
# file, generated by `sudo shpd-server dev-https` from development-https.conf.

server {
    listen 80;
    server_name ~^(\d+\.\d+\.\d+\.\d+)$;

    root /opt/shipard/shpd/public;
    index index.php;

    # Versioned system parameters — updated via git pull + nginx reload
    # (no TLS include here — TLS belongs only in 443 ssl blocks)
    include /opt/shipard/shpd/docs/nginx/shipard-common.conf;

    # Versioned location blocks shared with the https site (assets, /{ds-id}/app/, /)
    include /opt/shipard/shpd/docs/nginx/development-locations.conf;

    # PHP-FPM (install-packages.sh replaces the socket with the shipard pool)
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # The Host header as the browser sent it, port included ($host drops
        # the port) — absolute URLs are built from it (#183 D2).
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
    }
}
