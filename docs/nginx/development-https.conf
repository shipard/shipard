# ─── Development — https ─────────────────────────────────────────────────────
#
# Template of /etc/nginx/sites-available/shipard-https.conf. The site file is
# generated by `sudo shpd-server dev-https` from `devAccess` in
# /etc/shipard/server.json — do not install this template by hand: a missing
# certificate file would take the whole nginx down, http on the IP included
# (#183 D4). Without an enabled https entry the site file does not exist.
#
# What the generator does with this template:
#   # >>> https-ip … # <<< https-ip       kept when devAccess.httpsIp is on
#   # >>> https-host … # <<< https-host   kept when devAccess.host is set
#   lines ending with `# ipv6`            kept only when devAccess.ipv6 is on
#                                         and IPv6 is enabled on the server
#                                         (/proc/net/if_inet6 exists) — #183 D8:
#                                         the developer dashboard has no login,
#                                         so https stays on IPv4 unless asked
#   __SERVER_NAME__                       replaced with devAccess.host
#   fastcgi_pass unix:/run/php/…;         replaced with the shipard pool socket
#                                         (the same rule as install-packages.sh)
#
# No HSTS in development: the blocks include shipard-tls-params.conf, not
# shipard-tls.conf (#183 D5).

# >>> https-ip
# https://{ip}/{ds-id}/app/ — self-signed certificate with the addresses of
# this server in SAN, made by `shpd-server dev-https`. default_server: without
# SNI (an IP address in the URL) nginx picks the certificate of the default
# server on the port.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server; # ipv6
    server_name _;

    ssl_certificate     /etc/shipard/tls/dev-ip/fullchain.pem;
    ssl_certificate_key /etc/shipard/tls/dev-ip/privkey.pem;

    root /opt/shipard/shpd/public;
    index index.php;

    include /opt/shipard/shpd/docs/nginx/shipard-common.conf;
    include /opt/shipard/shpd/docs/nginx/shipard-tls-params.conf;
    include /opt/shipard/shpd/docs/nginx/development-locations.conf;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
    }
}
# <<< https-ip

# >>> https-host
# https://{name}/{ds-id}/app/ — certificate supplied by the developer
# (fullchain.pem and privkey.pem may be symlinks, e.g. to certbot's live/).
# A named block, not a catch-all, so that it does not fight other sites on 443.
server {
    listen 443 ssl;
    listen [::]:443 ssl; # ipv6
    server_name __SERVER_NAME__;

    ssl_certificate     /etc/shipard/tls/dev-host/fullchain.pem;
    ssl_certificate_key /etc/shipard/tls/dev-host/privkey.pem;

    root /opt/shipard/shpd/public;
    index index.php;

    include /opt/shipard/shpd/docs/nginx/shipard-common.conf;
    include /opt/shipard/shpd/docs/nginx/shipard-tls-params.conf;
    include /opt/shipard/shpd/docs/nginx/development-locations.conf;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
    }
}
# <<< https-host
